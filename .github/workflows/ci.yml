name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '40 2 * * *'  # Diariamente às 23:40 BRT (02:40 UTC)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm install --audit false

      - name: Verificar qualidade de código (ESLint)
        run: npm run lint

  audit:
    name: Auditoria de Segurança
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm install --audit false

      - name: Verificar vulnerabilidades críticas
        run: npm audit --audit-level=critical
        continue-on-error: true

  test:
    name: Testes (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm install --audit false

      - name: Executar testes e gerar relatório JUnit
        run: npm run test:ci

      - name: Publicar relatório JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-junit-node${{ matrix.node-version }}
          path: test-results/results.xml

      - name: Gerar relatório de cobertura (nyc)
        run: npm run test:coverage
        if: always()

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-cobertura-node${{ matrix.node-version }}
          path: coverage/

      - name: Gerar relatório HTML (mochawesome)
        run: npm run test:report
        if: always()

      - name: Publicar relatório HTML (mochawesome)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-html-node${{ matrix.node-version }}
          path: mochawesome-report/

  deploy-pages:
    name: Publicar Relatório (GitHub Pages)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm install --audit false

      - name: Gerar relatório HTML (mochawesome)
        run: npm run test:report

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: mochawesome-report/

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

